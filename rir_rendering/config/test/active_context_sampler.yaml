BASE_TASK_CONFIG_PATH: "configs/tasks/active_context_sampler/test_active_context_sampler.yaml"
TRAINER_NAME: "ActiveRIRTrainer"
ENV_NAME: "TeleportEnv"
SIMULATOR_GPU_ID: 0
TORCH_GPU_ID: 0
VIDEO_OPTION: []
TENSORBOARD_DIR: "tb"
VIDEO_DIR: "video_dir"
TEST_EPISODE_COUNT: 2
EVAL_CKPT_PATH_DIR: "data/new_checkpoints"
NUM_ENVIRONMENTS: 6
SENSORS: ["RGB_SENSOR", "DEPTH_SENSOR"]
CHECKPOINT_FOLDER: "data/new_checkpoints"

EVAL:
  SPLIT: "val_telephone"

NUM_PROCESSES: 10

UniformContextSampler:

  batch_size: 8
  num_workers: 8

  num_datapoints_per_scene_eval: 14

  predict_in_logspace: True
  log1p_gt: False
  log_instead_of_log1p_in_logspace: True
  log_gt: False
  log_gt_eps: 1.0e-8

  EvalMetrics:
    types: ["stft_l1_distance", "diff_rt_startFrom60dB", "diff_drr_3ms"]

  encode_each_modality_as_independent_context_entry: True
  append_modality_type_tag_encoding_to_each_modality_encoding: True
  modality_type_tag_encoding_size: 8

  MemoryNet:
    type: "transformer" 

    Transformer:
      input_size: 1024  
      hidden_size: 2048 
      num_encoder_layers: 6 
      num_decoder_layers: 6 
      nhead: 8 
      dropout: 0.1
      activation: 'relu'

  PositionalEnc:
    type: "sinusoidal"
    num_freqs_for_sinusoidal: 8 
    shared_pose_encoder_for_context_n_query: True
    #n_positional_obs: 3 #is this right? -> Check with Sagnik

  FusionEnc:
    type: "concatenate"

  FusionDec:
    type: "concatenate"

RL:
  PPO:
    # ppo params
    clip_param: 0.1
    ppo_epoch: 4
    num_mini_batch: 1
    value_loss_coef: 0.5
    entropy_coef: 0.20
    lr: 2.5e-4
    eps: 1e-5
    max_grad_norm: 0.5
    # decide the length of history that ppo encodes
    num_steps: 20
    hidden_size: 512
    use_gae: True
    gamma: 0.99
    tau: 0.95
    use_linear_clip_decay: True
    use_linear_lr_decay: True
    # window size for calculating the past rewards
    reward_window_size: 50
